<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2a49">
<title>Ballon</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1b2a49;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(27,42,73,.9);color:#fff;text-align:center;padding:16px}
  .hide{display:none!important}
  h1{margin:0;font-size:48px;letter-spacing:3px}
  p{margin:0;color:#cfd8ea;font-size:18px}
  #big{font-size:56px;font-weight:800}
  button{font:inherit;font-size:22px;font-weight:700;border:0;border-radius:16px;background:#ffcc33;color:#1b2a49;padding:12px 28px}
  .row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px}
  input{font:inherit;font-size:18px;border:0;border-radius:14px;padding:10px 12px;width:150px;-webkit-user-select:text;user-select:text}
  .small{font-size:16px;padding:10px 14px;background:#fff}
  .err{color:#ffb4a8;min-height:1em;font-size:15px}
  a{color:#ffcc33}
  ol{margin:0;padding:0 0 0 30px;text-align:left;font-size:18px;min-width:200px;max-height:55vh;overflow:auto;color:#fff}
  li{padding:2px 0}
  li.me{font-weight:800;color:#ffcc33}
  #mute{position:fixed;top:8px;right:8px;z-index:5;font-size:18px;padding:6px 10px;background:rgba(255,255,255,.85)}
  #rotate{display:none;z-index:10}
  @media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="Couper le son">🔊</button>
<div id="menu" class="ov">
  <h1>BALLON</h1>
  <p>Penche le téléphone ou glisse ton doigt pour bouger la balle jaune.<br>Esquive les balles qui tombent !</p>
  <div id="reg" class="row"><input id="nameIn" maxlength="12" placeholder="Ton pseudo" autocomplete="off"><button id="regBtn" class="small">S'enregistrer</button></div>
  <p id="hello" class="hide">Joueur : <b id="meName"></b> · <a href="#" id="logout">changer</a></p>
  <p id="regMsg" class="err"></p>
  <p id="best"></p>
  <div class="row"><button id="play">Jouer</button><button id="boardBtn" class="small">🏆 Scores</button></div>
</div>
<div id="board" class="ov hide">
  <h1>🏆 Scores</h1>
  <ol id="boardList"></ol>
  <button id="boardClose" class="small">Retour</button>
</div>
<div id="over" class="ov hide">
  <div class="row" style="gap:32px">
    <div class="col">
      <p>Tu as tenu</p>
      <div id="big"></div>
      <p id="best2"></p>
    </div>
    <div class="col"><ol id="overList"></ol><p id="overMsg" class="err"></p></div>
  </div>
  <div class="row"><button id="again">Rejouer</button><button id="toMenu" class="small">Menu</button></div>
</div>
<div id="rotate" class="ov"><h1>↻</h1><p>Tourne ton téléphone<br>en mode paysage</p></div>
<script>
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W, H, dpr, player, balls, t, spawnIn, running = false, last = 0, me = null;
try { me = JSON.parse(localStorage.getItem('ballon-me')) } catch {}
const COLORS = ['#ff5e5b', '#00cecb', '#a06cd5', '#ff9f1c', '#2ec4b6', '#e71d36', '#7bd389'];

function getBest() { try { return +localStorage.getItem('ballon-best') || 0 } catch { return 0 } }
function setBest(v) { try { localStorage.setItem('ballon-best', v) } catch {} }
function showBest() { const b = getBest(); $('best').textContent = b ? 'Record : ' + b.toFixed(1) + ' s' : ''; }

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (player) { player.r = H * 0.07; player.y = H - player.r; player.x = Math.min(Math.max(player.x, player.r), W - player.r); }
  if (!running) draw();
}
addEventListener('resize', resize);

function start() {
  player = { x: W / 2, r: H * 0.07 }; player.y = H - player.r;
  balls = []; t = 0; spawnIn = 0.5; running = true; last = performance.now(); musicStart();
  tilt0 = tilt;                                  // la position du téléphone au départ = « à plat »
  $('menu').classList.add('hide'); $('over').classList.add('hide');
  requestAnimationFrame(loop);
}
$('play').onclick = $('again').onclick = () => { enableTilt(); start(); };

// Inclinaison : penche le téléphone à gauche / à droite (paysage). iOS demande la permission au 1er clic.
const TILT_SPEED = 1.2;   // écrans par seconde à fond ; réglage si trop vif / trop mou
const TILT_MAX = 25;      // degrés pour la vitesse max
let tilt = null, tilt0 = null, tiltOn = false;
async function enableTilt() {
  if (tiltOn) return;
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission)
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
    tiltOn = true;
    addEventListener('deviceorientation', e => {
      if (e.beta === null) return;
      // en paysage, gauche/droite = beta ; le signe dépend du sens dans lequel on tient le téléphone
      const angle = screen.orientation ? screen.orientation.angle : (window.orientation || 0);
      tilt = (angle === 90 ? 1 : -1) * e.beta;
      if (tilt0 === null && running) tilt0 = tilt;
    });
  } catch {}
}

// Relative drag: the ball follows the finger's horizontal movement, wherever you touch.
let dragX = null;
cv.addEventListener('pointerdown', e => { dragX = e.clientX; });
addEventListener('pointermove', e => {
  if (dragX === null || !running) return;
  player.x = Math.min(Math.max(player.x + (e.clientX - dragX) * 1.3, player.r), W - player.r);
  dragX = e.clientX;
});
addEventListener('pointerup', () => dragX = null);
addEventListener('pointercancel', () => dragX = null);

function spawn() {
  const r = H * (0.03 + Math.random() * 0.11);          // petites à grosses
  const dir = Math.random() < 0.5 ? -1 : 1;
  const speed = 1 + t / 40;                              // ça accélère avec le temps
  balls.push({
    x: r + Math.random() * (W - 2 * r), y: -r, r,
    vx: dir * H * (0.3 + Math.random() * 0.35) * speed,
    vy: H * Math.random() * 0.3,
    c: COLORS[Math.random() * COLORS.length | 0]
  });
}

function loop(now) {
  if (!running) return;
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (Math.floor(t + dt) > Math.floor(t) && Math.floor(t + dt) % 10 === 0) sfx.level();  // jingle toutes les 10 s
  t += dt;
  if (tilt !== null && tilt0 !== null && dragX === null) {
    const k = Math.max(-1, Math.min(1, (tilt - tilt0) / TILT_MAX));
    if (Math.abs(k) > 0.08)                      // petite zone morte pour que la balle ne dérive pas
      player.x = Math.min(Math.max(player.x + k * W * TILT_SPEED * dt, player.r), W - player.r);
  }
  spawnIn -= dt;
  if (spawnIn <= 0) { spawn(); spawnIn = Math.max(0.25, 1.1 - t / 60) * (0.6 + Math.random() * 0.8); }
  const g = H * 1.6;
  for (const b of balls) {
    b.vy += g * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    // rebond au sol, toujours assez haut (≥ 45 % de l'écran) pour qu'on puisse passer dessous
    if (b.y > H - b.r) { b.y = H - b.r; b.vy = -Math.max(Math.abs(b.vy) * 0.82, Math.sqrt(2 * g * H * 0.45)); sfx.bounce(b.r); }
    const dx = b.x - player.x, dy = b.y - player.y, rr = (b.r + player.r) * 0.9; // hitbox un peu indulgente
    if (dx * dx + dy * dy < rr * rr) return gameOver();
  }
  balls = balls.filter(b => b.x > -b.r && b.x < W + b.r);  // sorties de l'écran
  draw();
  requestAnimationFrame(loop);
}

function gameOver() {
  running = false; dragX = null; draw();
  musicStop(); sfx.hit();
  if (navigator.vibrate) navigator.vibrate(200);
  if (t > getBest()) setBest(t);
  $('big').textContent = t.toFixed(1) + ' s';
  $('best2').textContent = 'Record : ' + getBest().toFixed(1) + ' s';
  // score envoyé en dixièmes de seconde (entier) ; le serveur garde le meilleur
  const list = $('overList'), msg = $('overMsg'); list.textContent = '';
  msg.textContent = me ? 'Envoi du score…' : 'Enregistre un pseudo au menu pour entrer au tableau des scores';
  (me ? api('scores', { name: me.name, token: me.token, score: Math.round(t * 10) }) : api('scores'))
    .then(l => { renderBoard(list, l.slice(0, 5)); if (me) msg.textContent = '' },
      e => msg.textContent = e === 403 ? 'Pseudo inconnu : réenregistre-toi au menu' : 'Tableau des scores indisponible');
  $('over').classList.remove('hide');
}

function circle(x, y, r, c) { cx.fillStyle = c; cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill(); }
function draw() {
  cx.fillStyle = '#1b2a49'; cx.fillRect(0, 0, W, H);
  if (!player) return;
  for (const b of balls) { circle(b.x, b.y, b.r, b.c); circle(b.x - b.r * .3, b.y - b.r * .3, b.r * .25, 'rgba(255,255,255,.35)'); }
  circle(player.x, player.y, player.r, '#ffcc33');
  circle(player.x - player.r * .3, player.y - player.r * .3, player.r * .25, 'rgba(255,255,255,.5)');
  cx.fillStyle = '#fff'; cx.font = 'bold ' + (H * 0.07 | 0) + 'px system-ui'; cx.textAlign = 'center';
  cx.fillText(t.toFixed(1) + ' s', W / 2, H * 0.1);
}

// ---------- tableau des scores (même API que Jump) ----------
// URL relative : marche sous /ballon/ sur le Mac mini, échoue proprement en statique
function api(path, body) {
  return fetch('api/' + path, body && { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(r => r.ok ? r.json() : Promise.reject(r.status));
}
function renderBoard(el, list) {
  el.replaceChildren(...list.map(p => {
    const li = document.createElement('li');
    li.textContent = p.name + ' — ' + (p.score / 10).toFixed(1) + ' s';
    if (me && p.name.toLowerCase() === me.name.toLowerCase()) li.className = 'me';
    return li;
  }));
  if (!list.length) el.textContent = "Aucun score pour l'instant";
}
function showMe() {
  $('reg').classList.toggle('hide', !!me); $('hello').classList.toggle('hide', !me);
  if (me) $('meName').textContent = me.name;
}
$('regBtn').onclick = async () => {
  const name = $('nameIn').value.trim(), msg = $('regMsg');
  if (!name) { msg.textContent = 'Écris un pseudo'; return; }
  msg.textContent = '…';
  try {
    me = await api('register', { name });
    try { localStorage.setItem('ballon-me', JSON.stringify(me)) } catch {}
    msg.textContent = ''; showMe();
  } catch (e) { msg.textContent = e === 409 ? 'Ce pseudo est déjà pris' : 'Inscription indisponible'; }
};
$('nameIn').onkeydown = e => { if (e.key === 'Enter') $('regBtn').click(); };
$('logout').onclick = e => {
  e.preventDefault(); me = null;
  try { localStorage.removeItem('ballon-me') } catch {}
  showMe();
};
$('boardBtn').onclick = () => {
  $('board').classList.remove('hide'); $('boardList').textContent = 'Chargement…';
  api('scores').then(l => renderBoard($('boardList'), l), () => $('boardList').textContent = 'Tableau des scores indisponible');
};
$('boardClose').onclick = () => $('board').classList.add('hide');
$('toMenu').onclick = () => { $('over').classList.add('hide'); showBest(); $('menu').classList.remove('hide'); };

// ---------- son (Web Audio, tout synthétisé, aucun fichier ; repris de Jump) ----------
let ac, master, musicGain, muted = false, musicTimer, step = 0, nextT = 0;
try { muted = localStorage.getItem('ballon-mute') === '1' } catch {}
function audio() { // doit d'abord tourner dans un appui (règles autoplay iOS/Android)
  if (!ac) {
    const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
    if (!AC) return null;
    ac = new AC(); master = ac.createGain(); master.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.gain.value = .35; musicGain.connect(master);
  }
  master.gain.value = muted ? 0 : .5;
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f1, f2, dur, type = 'square', vol = .3, when = 0, out = master) {
  if (!ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), v = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(v); v.connect(out); o.start(t); o.stop(t + dur + .02);
}
const arp = (notes, gap, type, vol) => notes.forEach((f, i) => tone(f, f, gap * 1.4, type, vol, i * gap));
const sfx = {
  bounce: r => { const f = 900 * H * .03 / r; tone(f, f * .55, .12, 'sine', .18); },  // grosse balle = son grave
  hit: () => tone(600, 80, .9, 'sawtooth', .22),
  level: () => arp([523, 659, 784, 1047], .08, 'square', .12),
};
const midi = m => 440 * 2 ** ((m - 69) / 12);
const MEL = [76, 0, 79, 0, 81, 79, 76, 0, 74, 0, 76, 79, 76, 0, 0, 0, 72, 0, 74, 76, 79, 0, 76, 74, 72, 0, 74, 0, 72, 0, 0, 0];
const BASS = [45, 45, 48, 50, 41, 43, 45, 45];
function schedule() {
  const len = .15 / Math.min(1 + t / 60, 1.6); // croche, de plus en plus rapide avec le temps
  if (nextT < ac.currentTime) nextT = ac.currentTime + .05; // onglet ralenti : pas de rafale
  while (nextT < ac.currentTime + .2) {
    const w = nextT - ac.currentTime, m = MEL[step % 32];
    if (m) tone(midi(m), midi(m), len * .9, 'square', .1, w, musicGain);
    if (step % 2 === 0) { const b = midi(BASS[(step >> 2) % 8]); tone(b, b, len * 1.6, 'triangle', .3, w, musicGain); }
    nextT += len; step++;
  }
}
function musicStart() { if (!audio() || musicTimer) return; step = 0; nextT = ac.currentTime + .1; musicTimer = setInterval(schedule, 50); }
function musicStop() { clearInterval(musicTimer); musicTimer = null; }
function showMute() { $('mute').textContent = muted ? '🔇' : '🔊'; }
$('mute').onclick = () => {
  muted = !muted; showMute();
  try { localStorage.setItem('ballon-mute', muted ? '1' : '0') } catch {}
  if (audio()) master.gain.value = muted ? 0 : .5;
};
showMute();

resize(); showBest(); showMe();
</script>
</body>
</html>
